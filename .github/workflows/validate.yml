name: Validate ACED
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax, internal links and retired content
        run: node tools/check.js
      - name: Validate starter packs
        run: node tools/validate.js
      - name: Test pack import, persistence and sharing
        run: node aced-library.test.js
      - name: Test the real scoring engine and all jokers
        run: node aced-game-rules.test.js
      - name: Test review identity and optional module contracts
        run: |
          node aced-core.test.js
          node aced-pack.test.js
          node aced-jokers.test.js
          node aced-tbs.test.js
          node aced-vault.test.js
          node nemesis.test.js
          node nemesis-encounter.test.js
      - name: Test optional backend merge and leaderboard guards
        run: |
          node server/merge.test.js
          node server/leaderboard.test.js
