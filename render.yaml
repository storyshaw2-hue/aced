# render.yaml — one-click deploy blueprint for the ACED API (server/).
# ============================================================================
# This provisions the API as a Render web service. The database is an EXTERNAL
# managed Postgres (Neon free plan by default) whose connection string you
# paste into DATABASE_URL when Render asks for it.
#
# WHY THE DATABASE IS NOT A RENDER `fromDatabase` REFERENCE:
#   - In production the API verifies the database's TLS certificate and refuses
#     to start if it cannot (server/db-tls.js, fail closed).
#   - A Blueprint `fromDatabase.connectionString` is Render's PRIVATE-network
#     URL. Render documents that those internal connections use self-signed
#     certificates and do not support verify-ca / verify-full
#     (https://render.com/docs/postgresql-creating-connecting), so the API
#     would exit at startup with `database_tls_not_verified`.
#   - Render's free Postgres also expires 30 days after creation.
#   Neon's certificates chain to a public CA already in Node's trust store, and
#   its free plan does not expire. Any Postgres with a publicly trusted
#   certificate works the same way (Supabase, or a Render database's EXTERNAL
#   URL); the app code is identical.
#
# Deploy: in Render -> "New +" -> "Blueprint", pick this repo, then fill the two
# `sync: false` secrets (DATABASE_URL, RESEND_API_KEY) in the form. Never commit
# either value.
# ============================================================================

services:
  - type: web
    name: aced-api
    runtime: node
    rootDir: server
    plan: free                 # fine for a hobby API; the DB is what must persist
    region: ohio               # keep close to the database (Neon "AWS US East 2 (Ohio)")
    # `npm ci` installs exactly what package-lock.json pins. The database transport
    # (server/db-tls-transport.js) only runs against those exact driver versions.
    # `--omit=optional` skips better-sqlite3, which the Postgres path never loads.
    buildCommand: npm ci --omit=optional
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"      # the database transport supports Node 20 only; keep this pinned
      - key: NODE_ENV
        value: production
      - key: APP_URL           # where the static app is served (CORS + redirect target)
        value: https://acedhq.com
      - key: API_URL           # this service's own public URL (used to build magic links)
        value: https://aced-api.onrender.com
      - key: JWT_SECRET        # session signing — generated once, kept stable
        generateValue: true
      - key: DATABASE_URL      # external Postgres connection string (see note at top) — REQUIRED
        sync: false            # set in dashboard (secret); must be a host with a publicly trusted certificate
      - key: RESEND_API_KEY    # email delivery for magic links — REQUIRED in prod
        sync: false            # set in dashboard (secret); without it sign-in can't deliver
      - key: EMAIL_FROM          # must be an address on a domain verified in the Resend account
        value: ACED <signin@acedhq.com>      # that owns RESEND_API_KEY, or Resend rejects the send
      # Billing is disabled. To enable it later, add STRIPE_SECRET_KEY and
      # STRIPE_WEBHOOK_SECRET in the Render dashboard (Environment), not here.

# ----------------------------------------------------------------------------
# ALTERNATIVE — SQLite on a persistent disk instead of Postgres.
# Render disks require a paid instance (Starter+, ~$7/mo); free instances have
# no disk. To use this path: delete the DATABASE_URL env var above, change the
# build command back to `npm install --build-from-source` (SQLite is a native
# module), bump the service `plan:` to `starter`, and add to the service:
#
#   disk:
#     name: aced-data
#     mountPath: /data
#     sizeGB: 1
#
# ...plus an env var:  - key: DB_PATH  value: /data/aced.db
# ----------------------------------------------------------------------------
